apply plugin: 'com.google.protobuf'
apply from: 'protoLint.gradle'

def protobufVersion = '3.25.8'

dependencies {
    api group: 'com.google.protobuf', name: 'protobuf-java', version: protobufVersion
    api group: 'com.google.protobuf', name: 'protobuf-java-util', version: protobufVersion
    api group: 'net.jcip', name: 'jcip-annotations', version: '1.0'

//    checkstyleConfig "com.puppycrawl.tools:checkstyle:${versions.checkstyle}"
    // google grpc
    api group: 'io.grpc', name: 'grpc-netty', version: rootProject.grpcVersion
    api group: 'io.grpc', name: 'grpc-protobuf', version: rootProject.grpcVersion
    api group: 'io.grpc', name: 'grpc-stub', version: rootProject.grpcVersion
    api group: 'io.grpc', name: 'grpc-core', version: rootProject.grpcVersion
    api group: 'io.grpc', name: 'grpc-services', version: rootProject.grpcVersion

    // end google grpc

    api group: 'com.google.api.grpc', name: 'proto-google-common-protos', version: '2.15.0'
}

tasks.matching { it instanceof Test }.all {
    testLogging.events = ["failed", "passed", "skipped"]
}

sourceSets {
    main {
        proto {
            srcDir 'src/main/protos'
        }
        // The protocol module has no hand-written java sources; anything under
        // src/main/java is leftover output of builds that predate the codegen
        // relocation to build/generated. Drop that srcDir (keeping the dirs the
        // protobuf plugin registered) so leftovers can never shadow the
        // generated classes, even when generateProto is UP-TO-DATE.
        java {
            srcDirs = srcDirs.findAll { it != file('src/main/java') }
        }
    }

}

protobuf {
    protoc {
        artifact = "com.google.protobuf:protoc:${protobufVersion}"
    }

    plugins {
        grpc {
            artifact = "io.grpc:protoc-gen-grpc-java:${rootProject.archInfo.requires.ProtocGenVersion}"
        }
    }
    generateProtoTasks {
        all().each { task ->
            task.builtins {
                java { outputSubDir = "java" }
            }
        }
        all()*.plugins {
            grpc {
                outputSubDir = "java"
            }
        }
    }
}

// Disk hygiene only (correctness is handled by the srcDirs override above,
// which also covers the case where generateProto is UP-TO-DATE and its
// doFirst never runs): sweep pre-relocation codegen leftovers from src/.
def purgeLegacyGeneratedSources = {
    project.delete('src/main/java', 'src/main/gen')
}
generateProto.doFirst { purgeLegacyGeneratedSources() }
clean.doFirst { purgeLegacyGeneratedSources() }

// The srcDirs override above flattens the source set to plain files, losing
// the builtBy dependency the protobuf plugin registered, so declare it here.
compileJava.dependsOn(generateProto) // explicit_dependency
processResources.dependsOn(generateProto) // explicit_dependency
