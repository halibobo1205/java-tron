version '1.0.0'

def aspectjVersion = '1.9.25'

dependencies {
    api group: 'com.fasterxml.jackson.core', name: 'jackson-databind', version: '2.18.9' // https://github.com/FasterXML/jackson-databind/issues/3627
    api "com.cedarsoftware:java-util:3.2.0"
    api group: 'org.apache.httpcomponents', name: 'httpasyncclient', version: '4.1.1'
    api group: 'commons-codec', name: 'commons-codec', version: '1.11'
    api group: 'com.typesafe', name: 'config', version: '1.3.2'
    api group: 'io.prometheus', name: 'simpleclient', version: '0.15.0'
    api group: 'io.prometheus', name: 'simpleclient_httpserver', version: '0.15.0'
    api group: 'io.prometheus', name: 'simpleclient_hotspot', version: '0.15.0'
    // https://openjdk.org/jeps/396, JEP 396: Strongly Encapsulate JDK Internals by Default
    // https://eclipse.dev/aspectj/doc/latest/release/JavaVersionCompatibility.html
    api "org.aspectj:aspectjrt:${aspectjVersion}"
    api "org.aspectj:aspectjweaver:${aspectjVersion}"
    api "org.aspectj:aspectjtools:${aspectjVersion}"
    api group: 'io.github.tronprotocol', name: 'libp2p', version: '2.2.8',{
        exclude group: 'io.grpc', module: 'grpc-context'
        exclude group: 'io.grpc', module: 'grpc-core'
        exclude group: 'io.grpc', module: 'grpc-netty'
        exclude group: 'com.google.protobuf', module: 'protobuf-java'
        exclude group: 'com.google.protobuf', module: 'protobuf-java-util'
        // https://github.com/dom4j/dom4j/pull/116
        // https://github.com/gradle/gradle/issues/13656
        // https://github.com/dom4j/dom4j/issues/99
        exclude group: 'jaxen', module: 'jaxen'
        exclude group: 'javax.xml.stream', module: 'stax-api'
        exclude group: 'net.java.dev.msv', module: 'xsdlib'
        exclude group: 'pull-parser', module: 'pull-parser'
        exclude group: 'xpp3', module: 'xpp3'
        exclude group: 'org.bouncycastle', module: 'bcprov-jdk18on'
        exclude group: 'org.bouncycastle', module: 'bcutil-jdk18on'
    }
    // libp2p 2.2.8 was compiled against Netty 4.1.x and references
    // io.netty.handler.codec.protobuf.ProtobufVarint32*. Netty 4.2 moved those classes
    // out of netty-codec into netty-codec-protobuf, so add it explicitly to keep them on
    // the runtime classpath (also covers framework's BackupServer at compile time via api).
    // protobuf-javanano is a compile-scope dependency of netty-codec-protobuf, pinned by
    // netty-parent to 3.0.0-alpha-7 (2016, discontinued, never patched). Nothing here uses the
    // nano runtime, and without this exclude it is packaged into the released fat jars.
    api(group: 'io.netty', name: 'netty-codec-protobuf', version: '4.2.15.Final') {
        exclude group: 'com.google.protobuf.nano', module: 'protobuf-javanano'
    }
    api project(":protocol")
    api project(":platform")
}

jacocoTestReport {
    reports {
        xml.required.set(true)
        html.required.set(true)
    }
    getExecutionData().setFrom(fileTree('../framework/build/jacoco').include("**.exec"))
    afterEvaluate {
        classDirectories.from = classDirectories.files.collect {
            fileTree(dir: it,)
        }
    }
}
